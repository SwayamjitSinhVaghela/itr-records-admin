<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ITR Records</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}

:root{
  --bg: linear-gradient(160deg, #f6f3ff 0%, #ede9fe 35%, #e0e7ff 65%, #f0e6ff 100%);
  --card: rgba(255,255,255,.88);
  --card-border: rgba(255,255,255,.6);
  --shadow: 0 8px 40px rgba(139,92,246,.10), 0 2px 8px rgba(0,0,0,.04);
  --shadow-lg: 0 20px 60px rgba(139,92,246,.15), 0 4px 16px rgba(0,0,0,.06);
  --primary: linear-gradient(135deg, #8b5cf6, #6366f1);
  --primary-hover: linear-gradient(135deg, #7c3aed, #4f46e5);
  --accent: #f59e0b;
  --text: #1e1b4b;
  --text-muted: #6b7280;
  --border: #e5e7eb;
  --radius: 16px;
  --radius-sm: 10px;
}

html{font-size:17px}
body{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,sans-serif;background:var(--bg);min-height:100vh;color:var(--text);line-height:1.5}
.container{max-width:1280px;margin:0 auto;padding:32px}

header{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.75);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.4)}
header .container{display:flex;justify-content:space-between;align-items:center;padding-top:16px;padding-bottom:16px}
.logo{font-size:1.35rem;font-weight:800;background:var(--primary);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-.02em}
nav{display:flex;gap:6px}
nav a{text-decoration:none;padding:10px 22px;border-radius:var(--radius-sm);font-size:.88rem;font-weight:600;color:var(--text);background:rgba(139,92,246,.07);transition:all .2s}
nav a:hover{background:rgba(139,92,246,.15);transform:translateY(-1px)}
nav a.active{background:var(--primary);color:#fff}

.flash{padding:14px 22px;border-radius:var(--radius-sm);margin-bottom:20px;font-size:.9rem;animation:fadeSlide .35s ease}
.flash.success{background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0}
.flash.error{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}
@keyframes fadeSlide{0%{opacity:0;transform:translateY(-10px)}100%{opacity:1;transform:translateY(0)}}

.card{background:var(--card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:var(--radius);border:1px solid var(--card-border);box-shadow:var(--shadow);padding:36px}
.card-sm{max-width:560px;margin:48px auto}

table{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
th,td{padding:14px 16px;text-align:left;font-size:.88rem;border-bottom:1px solid #f1f5f9}
th{background:#f8fafc;font-weight:700;color:var(--text-muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;padding-top:16px;padding-bottom:16px}
tr:last-child td{border-bottom:none}
tr:hover td{background:#f5f3ff}
.actions a{text-decoration:none;margin:0 4px;font-size:.82rem;font-weight:600;padding:6px 14px;border-radius:8px;transition:all .15s;display:inline-block}
.actions a.edit{color:#7c3aed;background:rgba(139,92,246,.08)}
.actions a.edit:hover{background:rgba(139,92,246,.18);transform:translateY(-1px)}
.actions a.del{color:#dc2626;background:rgba(220,38,38,.08)}
.actions a.del:hover{background:rgba(220,38,38,.16);transform:translateY(-1px)}

.badge{display:inline-block;padding:4px 12px;border-radius:8px;font-size:.78rem;font-weight:600}
.badge-blue{background:#ede9fe;color:#5b21b6}
.badge-pdf{background:#dbeafe;color:#1e40af;font-size:.7rem;padding:3px 10px;border-radius:6px}
.green{color:#059669;font-weight:700}
.red{color:#dc2626;font-weight:700}
.sub{color:#94a3b8;font-size:.82rem}

.empty{text-align:center;padding:80px 20px;color:var(--text-muted)}
.empty h2{margin-bottom:8px;font-size:1.2rem;color:var(--text)}
.empty p{color:#94a3b8;font-size:.95rem}
.empty .btn{margin-top:8px}

.actions-bar{display:flex;gap:12px;margin-bottom:22px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 28px;border:none;border-radius:var(--radius-sm);cursor:pointer;font-size:.9rem;font-weight:600;text-decoration:none;transition:all .2s;line-height:1}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.12)}
.btn:active{transform:translateY(0)}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-hover);box-shadow:0 8px 28px rgba(139,92,246,.30)}
.btn-secondary{background:#f1f5f9;color:var(--text)}
.btn-secondary:hover{background:#e2e8f0}
.btn-danger{background:#fef2f2;color:#dc2626}
.btn-danger:hover{background:#fee2e2}

form label{display:block;margin-bottom:5px;font-size:.82rem;font-weight:600;color:var(--text-muted)}
form input{width:100%;padding:12px 16px;border:2px solid #e5e7eb;border-radius:var(--radius-sm);margin-bottom:16px;font-size:.92rem;background:#fafafa;transition:all .2s;color:var(--text)}
form input:focus{outline:none;border-color:#8b5cf6;box-shadow:0 0 0 4px rgba(139,92,246,.12);background:#fff}
form input::placeholder{color:#c4b5fd}

.form-row{display:grid;grid-template-columns:1fr 1fr;gap:18px}

.footer{text-align:center;padding:32px;color:#c4b5fd;font-size:.82rem;font-weight:500}

/* Drop Zone */
.dropzone{border:2.5px dashed #c4b5fd;border-radius:var(--radius);padding:70px 20px;text-align:center;cursor:pointer;transition:all .25s;background:#faf5ff;margin-bottom:24px}
.dropzone:hover,.dropzone.dragover{border-color:#8b5cf6;background:#f5f3ff;transform:scale(1.01);box-shadow:0 0 0 4px rgba(139,92,246,.08)}
.dropzone-icon{font-size:3rem;margin-bottom:10px}
.dropzone-text{font-size:1.1rem;font-weight:600;color:var(--text)}
.dropzone-sub{font-size:.88rem;color:#94a3b8;margin-top:6px}
.dropzone input{display:none}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(30,27,75,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:1000;display:flex;align-items:center;justify-content:center;animation:fadeIn .25s ease}
@keyframes fadeIn{0%{opacity:0}100%{opacity:1}}
.modal{background:#fff;border-radius:20px;padding:40px;max-width:580px;width:92%;max-height:92vh;overflow-y:auto;box-shadow:var(--shadow-lg);animation:slideUp .35s cubic-bezier(.16,1,.3,1)}
@keyframes slideUp{0%{opacity:0;transform:translateY(30px) scale(.97)}100%{opacity:1;transform:translateY(0) scale(1)}}
.modal h2{font-size:1.25rem;margin-bottom:22px;color:var(--text);display:flex;align-items:center;gap:10px}
.modal .extracted{border-radius:var(--radius-sm);border:1.5px solid #f1f5f9;overflow:hidden;margin-bottom:20px}
.modal .extracted-row{display:flex;justify-content:space-between;border-bottom:1px solid #f8fafc;font-size:.88rem}
.modal .extracted-row:last-child{border-bottom:none}
.modal .extracted-row span{padding:12px 16px}
.modal .extracted-row .label{color:var(--text-muted);font-weight:500;background:#fafafa;width:40%}
.modal .extracted-row .value{font-weight:700;color:var(--text);width:60%;text-align:right}
.modal .btn-row{display:flex;gap:12px;margin-top:24px}
.modal .btn-row .btn{flex:1;justify-content:center;padding:14px}

/* scrollbar */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#c4b5fd;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#a78bfa}

@media(max-width:768px){
  html{font-size:15px}
  .container{padding:16px}
  .form-row{grid-template-columns:1fr}
  th,td{padding:10px 12px}
  .modal{padding:24px}
  .modal .extracted-row{flex-direction:column}
  .modal .extracted-row span{width:100%}
  .modal .extracted-row .value{text-align:left}
}
</style>
</head>
<body>
<header>
<div class="container">
<div class="logo">ITR Records</div>
<nav>
<a href="/">Dashboard</a>
<a href="/upload">Upload</a>
<a href="/add">Add</a>
</nav>
</div>
</header>
<div class="container">
{% with msgs = get_flashed_messages(with_categories=true) %}
{% if msgs %}
{% for cat, msg in msgs %}
<div class="flash {{ cat }}">{{ msg }}</div>
{% endfor %}
{% endif %}
{% endwith %}
{% block content %}{% endblock %}
</div>
<div class="footer">ITR Records &mdash; Indrajit Sinh Vaghela</div>
</body>
</html>
