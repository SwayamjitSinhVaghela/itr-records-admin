{% extends "base.html" %}
{% block content %}
<div class="card card-sm">
<h2 style="font-size:1.2rem;margin-bottom:24px;color:var(--text)">Edit Record #{{ record.id }}</h2>
<form method="POST">
<div class="form-row">
<div>
<label>PAN</label>
<input name="pan" value="{{ record.pan or '' }}" maxlength="10">
</div>
<div>
<label>Name</label>
<input name="name" value="{{ record.name or '' }}">
</div>
</div>
<div class="form-row">
<div>
<label>Taxes Paid (₹)</label>
<input name="taxes_paid" type="number" step="0.01" value="{{ record.taxes_paid or '' }}">
</div>
<div>
<label>Refund (₹)</label>
<input name="refund_amount" type="number" step="0.01" value="{{ record.refund_amount or '' }}">
</div>
</div>
<div class="form-row">
<div>
<label>Mobile</label>
<input name="mobile" value="{{ record.mobile or '' }}" maxlength="15">
</div>
<div>
<label>Fee Amount (₹)</label>
<input name="fee_amount" type="number" step="0.01" value="{{ record.fee_amount or '' }}">
</div>
</div>
<div style="display:flex;gap:12px;margin-top:8px">
<button type="submit" class="btn btn-primary" style="flex:1;justify-content:center;padding:14px">Update Record</button>
<a href="/" class="btn btn-secondary" style="flex:1;justify-content:center;padding:14px">Cancel</a>
</div>
</form>
</div>
{% endblock %}
